rn s.toLocaleLowerCase('el').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?…·]/g,'').replace(/\s+/g,' ').trim()}function make(tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}function home(){ $('game').classList.add('hidden');$('home').classList.remove('hidden');$('categories').replaceChildren();DATA.forEach((cat,i)=>{let b=make('button','','tile');b.innerHTML='<span class="emoji">'+cat.emoji+'</span><h3></h3><p class="muted"></p><span class="chip">'+cat.questions.length+' challenges</span>';b.querySelector('h3').textContent=cat.title;b.querySelector('p').textContent=cat.desc;b.onclick=()=>start(i);$('categories').append(b)})}function start(i){category=i;index=0;score=0;shuffled=DATA[i].questions.map(q=>({...q,choices:q.choices?[...q.choices].sort(()=>Math.random()-.5):undefined}));$('home').classList.add('hidden');$('game').classList.remove('hidden');$('topic').textContent=DATA[i].emoji+' '+DATA[i].title;render()}function finish(){let panel=$('answers');$('prompt').textContent='🎉 Topic complete!';$('instruction').textContent='Your score: '+score+' / '+shuffled.length+' (writing tasks are for self-practice).';$('progress').textContent='Finished';$('fill').style.width='100%';panel.replaceChildren();let again=make('button','Try this topic again','btn primary');again.onclick=()=>start(category);let all=make('button','Choose another topic','btn');all.onclick=home;panel.append(again,document.createTextNode(' '),all);$('feedback').textContent='';$('next').classList.add('hidden')}function render(){if(index>=shuffled.length)return finish();locked=false;let q=shuffled[index];$('progress').textContent='Question '+(index+1)+' of '+shuffled.length;$('score').textContent='Score: '+score;$('fill').style.width=(index/shuffled.length*100)+'%';$('prompt').textContent=q.prompt;$('answers').replaceChildren();$('feedback').textContent='';$('next').classList.add('hidden');$('instruction').textContent=q.type==='mc'?'Choose the best Greek sentence.':q.type==='order'?'Type the words in the correct order.':'Write your own sentence, then compare with an example.';if(q.type==='mc'){q.choices.forEach(opt=>{let b=make('button',opt,'choice');b.onclick=()=>{if(locked)return;locked=true;let good=opt===q.answer;if(good)score++;[...$('answers').children].forEach(x=>{x.disabled=true;if(x.textContent===q.answer)x.classList.add('correct');else if(x===b)x.classList.add('wrong')});$('feedback').textContent=good?'✨ Correct!':'Almost! Correct answer: '+q.answer;$('score').textContent='Score: '+score;$('next').classList.remove('hidden')};$('answers').append(b)})}else{let input=make('textarea','','entry');input.placeholder=q.type==='order'?'Write the full sentence here…':'Your Greek sentence…';input.setAttribute('aria-label','Your answer');$('answers').append(input);let check=make('button',q.type==='order'?'Check answer':'Show an example','btn primary');check.style.marginTop='12px';check.onclick=()=>{if(locked)return;locked=true;let correct=norm(input.value)===norm(q.answer);if(q.type==='order'&&correct)score++;$('feedback').textContent=q.type==='write'?'Example: '+q.answer:correct?'✨ Correct!':'Suggested answer: '+q.answer;$('score').textContent='Score: '+score;check.disabled=true;$('next').classList.remove('hidden')};$('answers').append(check)}}$('next').onclick=()=>{index++;render()};$('back').onclick=home;home();</script></body></html>
